{% extends "admin/layout.html" %}
{% block title %}{{ t('admin_edit_user_title') }}{% endblock %}
{% block content %}
<p><a href="{{ url_for('admin.users') }}" class="btn-link">&larr; {{ t('admin_users_title') }}</a></p>
<h1>{{ t('admin_edit_user_title') }}</h1>

<form method="post" class="admin-row-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label>
    {{ t('admin_col_email') }}
    <input type="email" name="email" value="{{ user.Email }}" required>
  </label>

  <label>
    {{ t('admin_fullname_placeholder') }}
    <input type="text" name="fullname" value="{{ user.FullName }}" required>
  </label>

  <label class="checkbox-label">
    <input type="checkbox" name="first_login" {{ "checked" if user.FirstLogin else "" }}>
    {{ t('admin_col_first_login') }}
  </label>

  <label>
    {{ t('admin_new_password') }}
    <input type="password" name="new_password">
    <span class="admin-field-hint">{{ t('admin_password_hint') }} {{ t('admin_force_password_note') }}</span>
  </label>

  <button type="submit" class="btn-primary">{{ t('common_save') }}</button>
</form>
{% endblock %}
